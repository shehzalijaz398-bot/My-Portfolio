<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
    </head>
    <body style="background-color: rgb(204, 204, 240);">
        <p style="font-size: 50px; text-align: center; "><b>Student's Registration Form</b></p>
        <form name="My Form">
            <table align="center" style="font-size: 20px;">
                <tr>
                    <td>
                        <hr>First Name :<hr>
                    </td>
                    <td>
                        <input type="text" placeholder="Sur name" name="fname">
                    </td>
                    <td>
                        <hr>Last Name :<hr>
                    </td>
                    <td>
                        <input type="text" placeholder="Last name" name="Lname">
                    </td>
                <tr>
                    <td>
                        <hr>Father's Name :<hr>
                    </td>
                    <td>
                        <input type="text" placeholder="Father's name" name="fathername">
                    </td>
                    <td>
                        <hr>Mother's Name :<hr>
                    </td>
                    <td>
                        <input type="text" placeholder="Mother's name" name="mothername">
                    </td>
                </tr>
                <tr>
                    <td>
                        <hr>Date of Birth :<hr>
                    </td>
                    <td>
                        <input type="date" name="date">
                    </td>
                    <td>
                        <hr>Gender :<hr>
                    </td>
                    <td>
                        <input type="radio" name="Gender" id="male" value="male">
                        <label for="male">Male</label>
                        <!-- <input type="radio" name="Gender"><span style="font-size: 18px;">Female</span> -->
                        <input type="radio" name="Gender"><span style="font-size: 18px;">Other's</span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <hr>Choose Course :<hr>
                    </td>
                    <td>
                        <select name="Course">
                            <option>---Select---</option>
                            <option>HTML</option>
                            <option>CSS</option>
                            <option>Java </option>
                            <option>Java Script</option>
                            <option>Pythan</option>
                            <option>ASP</option>
                            <option>PHP</option>
                        </select>
                    </td>
                    <td>
                        <hr>Hobbies :<hr>
                    </td>
                    <td>
                        <input type="checkbox" name="subject" id="english">
                        <label for="english">english</label>
                        
                        <input type="checkbox" name="hobbies"><span style="font-size: 18px;">Drawing</span>
                        <input type="checkbox" name="hobbies"><span style="font-size: 18px;">Playing</span>
                        <input type="checkbox" name="hobbies"><span style="font-size: 18px;">Sleeping</span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <hr>Email :<hr>
                    </td>
                    <td>
                        <input type="email" placeholder="Email" name="email">
                    </td>
                    <td>
                        <hr>Phone no :<hr>
                    </td>
                    <td>
                        <select>
                            <option>+92</option>
                            <option>+93</option>
                            <option>+49</option>
                            <option>+76</option>
                            <option>+66</option>
                            <option>+67</option>
                            <option>+98</option>
                            <option>+42</option>
                            <option>+32</option>
                            <option>+74</option>
                            <option>+65</option>
                            <option>+79</option>
                            <option>+80</option>
                            <option>+15</option>
                            <option>+57</option>
                            <option>+43</option>
                            <option>+88</option>
                            <option>+34</option>
                        </select>
                        <input type="phone" placeholder="+92***********">
                    </td>
                </tr>
                <tr>
                    <td>
                        <hr>Address :<hr>
                    </td>
                    <td>
                        <textarea name="Address" placeholder="Write Your Address here"></textarea>
                    </td>
                    <td>
                        <hr>Photo :<hr>
                    </td>
                    <td>
                        <input type="file">
                    </td>
                </tr>
            </table>
             <center>
                <input type="submit" name="Submit" value="Submit Now" style="font-size: 25px; background-color: rgb(101, 194, 224);" >
            </center>

        </form>
    </body>
